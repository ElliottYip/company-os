# RC12 public Demo ingress candidate. PREPARED_NOT_ENABLED.
# The matching certificate must be issued only after both authoritative A
# records target 47.242.52.235. Never use this file for the formal OIDC Alpha.

server {
    listen 80;
    listen [::]:80;
    server_name company-os.raft.xin;
    return 301 https://company-os.raft.xin$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name company-os-api.raft.xin;
    return 301 https://company-os-api.raft.xin$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name company-os.raft.xin;

    ssl_certificate /etc/letsencrypt/live/company-os.raft.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/company-os.raft.xin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/company-os-alpha-web.access.log;
    error_log /var/log/nginx/company-os-alpha-web.error.log;

    location / {
        proxy_pass http://172.31.11.3:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name company-os-api.raft.xin;

    ssl_certificate /etc/letsencrypt/live/company-os.raft.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/company-os.raft.xin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/company-os-alpha-api.access.log;
    error_log /var/log/nginx/company-os-alpha-api.error.log;

    location / {
        proxy_pass http://172.31.11.2:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
