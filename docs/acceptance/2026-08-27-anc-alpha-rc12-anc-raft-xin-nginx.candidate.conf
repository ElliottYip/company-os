# RC12 ANC-prefixed public Demo ingress candidate. PREPARED_NOT_ENABLED.
# Do not enable until both authoritative A records return 47.242.52.235 and a
# certificate covering both names exists. Never use this for formal OIDC Alpha.

server {
    listen 80;
    listen [::]:80;
    server_name anc.raft.xin;
    return 301 https://anc.raft.xin$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.anc.raft.xin;
    return 301 https://api.anc.raft.xin$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anc.raft.xin;

    ssl_certificate /etc/letsencrypt/live/anc.raft.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anc.raft.xin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/company-os-alpha-web.access.log;
    error_log /var/log/nginx/company-os-alpha-web.error.log;

    location / {
        proxy_pass http://172.31.11.3:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.anc.raft.xin;

    ssl_certificate /etc/letsencrypt/live/anc.raft.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anc.raft.xin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/company-os-alpha-api.access.log;
    error_log /var/log/nginx/company-os-alpha-api.error.log;

    location / {
        proxy_pass http://172.31.11.2:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
