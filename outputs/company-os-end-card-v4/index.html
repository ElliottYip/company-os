<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Company OS · Raft and Leico end card</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    body{display:grid;place-items:center;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .frame{position:relative;width:1920px;height:1080px;background:#fff;display:grid;place-items:center}
    /* Correct the center using the visible non-white pixel bounds of the
       complete lockup, including Leico's accent mark. */
    .lockup{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:112px;transform:translate(-19px,-6px)}
    .product{order:2;margin:0;font-size:98.2px;font-weight:560;line-height:.88;letter-spacing:-4.65px;white-space:nowrap;transform:translateX(10px)}
    .partners{order:1;display:flex;align-items:center;justify-content:center;gap:94px;height:92px}
    .raft-slot{position:relative;width:166px;height:92px;overflow:hidden;flex:0 0 auto}
    .raft-logo{position:absolute;width:166px;height:166px;left:0;top:-37px;display:block}
    .leico-logo{display:block;width:292px;height:auto;flex:0 0 auto}
  </style>
</head>
<body>
  <main class="frame" aria-label="Company OS end card">
    <section class="lockup" aria-label="Company OS, Raft and Leico">
      <h1 class="product">Company OS</h1>
      <div class="partners">
        <div class="raft-slot"><img class="raft-logo" src="../company-os-end-card-v1/raft-logo-mark.svg" alt="Raft"></div>
        <img class="leico-logo" src="leico-wordmark-cropped.png" alt="Leico">
      </div>
    </section>
  </main>
</body>
</html>
