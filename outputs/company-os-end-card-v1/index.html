<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company OS · Raft × Leico end card</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }
    body {
      display: grid;
      place-items: center;
      color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #fff;
    }
    .product {
      position: absolute;
      inset: 228px 0 auto;
      margin: 0;
      text-align: center;
      font-size: 72px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: -3.2px;
    }
    .collaboration {
      position: absolute;
      top: 492px;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 92px;
      transform: translateX(-50%);
    }
    .logo-slot {
      display: grid;
      width: 300px;
      height: 168px;
      place-items: center;
    }
    .raft-logo {
      width: 168px;
      height: 168px;
      display: block;
    }
    .times {
      color: #9a9a9a;
      font-size: 54px;
      font-weight: 300;
      line-height: 1;
    }
    /* Replace this node with the supplied transparent Leico SVG/PNG. */
    .leico-placeholder {
      font-size: 62px;
      font-weight: 620;
      line-height: 1;
      letter-spacing: 5px;
    }
  </style>
</head>
<body>
  <main class="frame" aria-label="Company OS end card">
    <h1 class="product">Company OS</h1>
    <section class="collaboration" aria-label="Raft and Leico">
      <div class="logo-slot">
        <img class="raft-logo" src="raft-logo-mark.svg" alt="Raft">
      </div>
      <div class="times" aria-hidden="true">×</div>
      <div class="logo-slot" id="leico-logo-slot">
        <div class="leico-placeholder">LEICO</div>
      </div>
    </section>
  </main>
</body>
</html>
