name: ${COMPANY_OS_COMPOSE_PROJECT:?set the site-scoped Compose project}

# Isolated acceptance profile for the small raft-generator host. PostgreSQL,
# OIDC, Vault and Agent execution remain external trust boundaries. The
# fixture-only reference Data Node remains a separate replaceable process. This
# file must never join an existing production network or reuse its volumes.
x-api-image: &api-image ${COMPANY_OS_API_IMAGE:?set an immutable API image digest}
x-api-security: &api-security
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=32m,mode=1777
  pids_limit: 96
  networks: [internal]
  volumes:
    - ${COMPANY_OS_SECRET_DIRECTORY:-/etc/company-os/secrets}:/run/company-os/secrets:ro

services:
  reference-data-node:
    image: ${COMPANY_OS_REFERENCE_DATA_NODE_IMAGE:?set the immutable acceptance Data Node image digest}
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.20
    mem_limit: 192m
    pids_limit: 64
    networks: [internal]
    environment:
      COMPANY_OS_REFERENCE_DATA_NODE_HOST: 0.0.0.0
      COMPANY_OS_REFERENCE_DATA_NODE_PORT: 4321
      COMPANY_OS_REFERENCE_DATA_NODE_CATALOG_FILE: /app/connectors/http-data-node-reference/fixtures/acceptance-fixtures.json
      COMPANY_OS_REFERENCE_DATA_NODE_STATE_FILE: /var/lib/company-os-data-node/protocol-state.json
      COMPANY_OS_REFERENCE_DATA_NODE_BEARER_TOKEN_FILE: /run/secrets/data-node-bearer-token
    ports:
      - "127.0.0.1:${COMPANY_OS_REFERENCE_DATA_NODE_PORT:?set the site Data Node loopback port}:4321"
    volumes:
      - ${COMPANY_OS_SECRET_DIRECTORY:-/etc/company-os/secrets}/data-node-bearer-token:/run/secrets/data-node-bearer-token:ro
      - company_os_staging_data_node:/var/lib/company-os-data-node

  migrate:
    <<: *api-security
    image: *api-image
    restart: "no"
    cpus: 0.25
    mem_limit: 256m
    command: ["node", "--experimental-strip-types", "scripts/migrate-postgres.ts"]
    environment:
      COMPANY_OS_DATABASE_URL_FILE: /run/company-os/secrets/migration-database-url
      NODE_EXTRA_CA_CERTS: /run/company-os/secrets/internal-ca-cert.pem

  provision-runtime:
    <<: *api-security
    image: *api-image
    restart: "no"
    cpus: 0.25
    mem_limit: 256m
    command: ["node", "--experimental-strip-types", "scripts/provision-postgres-runtime-role.ts"]
    environment:
      COMPANY_OS_MIGRATION_DATABASE_URL_FILE: /run/company-os/secrets/migration-database-url
      COMPANY_OS_RUNTIME_DATABASE_USER: ${COMPANY_OS_RUNTIME_DATABASE_USER:-company_os_runtime}
      COMPANY_OS_RUNTIME_DATABASE_PASSWORD_FILE: /run/company-os/secrets/runtime-database-password
      NODE_EXTRA_CA_CERTS: /run/company-os/secrets/internal-ca-cert.pem
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-security
    image: *api-image
    restart: unless-stopped
    cpus: 0.55
    mem_limit: 640m
    pids_limit: 128
    environment:
      COMPANY_OS_RELEASE_ID: ${COMPANY_OS_RELEASE_ID:?set the immutable release ID}
      COMPANY_OS_PROFILE: managed-cloud
      COMPANY_OS_EXPOSURE: public
      COMPANY_OS_RUNTIME_MODE: formal
      COMPANY_OS_PUBLIC_DEMO_ENABLED: "false"
      COMPANY_OS_HOST: 0.0.0.0
      COMPANY_OS_PORT: 4310
      COMPANY_OS_PUBLIC_URL: ${COMPANY_OS_PUBLIC_URL:?set the site API origin}
      COMPANY_OS_WEB_ORIGINS: ${COMPANY_OS_WEB_ORIGINS:?set the exact site Web origins}
      COMPANY_OS_DATABASE_URL_FILE: /run/company-os/secrets/runtime-database-url
      NODE_EXTRA_CA_CERTS: /run/company-os/secrets/internal-ca-cert.pem
      COMPANY_OS_OIDC_ISSUER: ${COMPANY_OS_OIDC_ISSUER:?set the staging OIDC issuer}
      COMPANY_OS_OIDC_DISCOVERY_URL: ${COMPANY_OS_OIDC_DISCOVERY_URL:?set the staging OIDC discovery URL}
      COMPANY_OS_OIDC_CLIENT_ID: ${COMPANY_OS_OIDC_CLIENT_ID:?set the product-scoped OIDC client ID}
      COMPANY_OS_OIDC_CLIENT_SECRET_FILE: /run/company-os/secrets/oidc-client-secret
      COMPANY_OS_OIDC_REDIRECT_URI: ${COMPANY_OS_OIDC_REDIRECT_URI:?set the site OIDC callback}
      COMPANY_OS_SESSION_SIGNING_KEY_FILE: /run/company-os/secrets/session-signing-key
      COMPANY_OS_INSTANCE_ID: ${COMPANY_OS_INSTANCE_ID:?set the stable site instance ID}
      COMPANY_OS_RETENTION_POLICY_ID: ${COMPANY_OS_RETENTION_POLICY_ID:-standard-retention}
      COMPANY_OS_ACCOUNTABILITY_EXPORT_POLICY_ID: ${COMPANY_OS_ACCOUNTABILITY_EXPORT_POLICY_ID:-standard-accountability-export}
      COMPANY_OS_TRUSTED_PROXY_CIDRS: ${COMPANY_OS_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      COMPANY_OS_CONNECTOR_PACKAGES: ${COMPANY_OS_CONNECTOR_PACKAGES:-@company-os/http-agent-node-connector}
      COMPANY_OS_SECRET_BROKER_PACKAGE: ${COMPANY_OS_SECRET_BROKER_PACKAGE:-@company-os/http-secret-broker}
      COMPANY_OS_DATA_CONNECTOR_PACKAGES: ${COMPANY_OS_DATA_CONNECTOR_PACKAGES:-@company-os/http-data-node-connector}
      COMPANY_OS_HTTP_AGENT_NODE_ID: ${COMPANY_OS_HTTP_AGENT_NODE_ID:?set the site Agent Node ID}
      COMPANY_OS_HTTP_AGENT_NODE_NAME: ${COMPANY_OS_HTTP_AGENT_NODE_NAME:?set the site Agent Node name}
      COMPANY_OS_HTTP_AGENT_NODE_BASE_URL: ${COMPANY_OS_HTTP_AGENT_NODE_BASE_URL:?set the HTTPS Agent Node URL}
      COMPANY_OS_HTTP_AGENT_NODE_BEARER_TOKEN_FILE: /run/company-os/secrets/agent-node-bearer-token
      COMPANY_OS_HTTP_AGENT_NODE_ALLOW_INSECURE_LOOPBACK: "false"
      COMPANY_OS_HTTP_DATA_NODE_ID: ${COMPANY_OS_HTTP_DATA_NODE_ID:?set the site Data Node ID}
      COMPANY_OS_HTTP_DATA_NODE_NAME: ${COMPANY_OS_HTTP_DATA_NODE_NAME:?set the site Data Node name}
      COMPANY_OS_HTTP_DATA_NODE_SOURCES: ${COMPANY_OS_HTTP_DATA_NODE_SOURCES:-acceptance-fixtures}
      COMPANY_OS_HTTP_DATA_NODE_OPERATIONS: ${COMPANY_OS_HTTP_DATA_NODE_OPERATIONS:-READ}
      COMPANY_OS_HTTP_DATA_NODE_BASE_URL: ${COMPANY_OS_HTTP_DATA_NODE_BASE_URL:?set the HTTPS Data Node URL}
      COMPANY_OS_HTTP_DATA_NODE_BEARER_TOKEN_FILE: /run/company-os/secrets/data-node-bearer-token
      COMPANY_OS_HTTP_SECRET_BROKER_ID: ${COMPANY_OS_HTTP_SECRET_BROKER_ID:?set the site Secret Broker ID}
      COMPANY_OS_HTTP_SECRET_BROKER_NAME: ${COMPANY_OS_HTTP_SECRET_BROKER_NAME:?set the site Secret Broker name}
      COMPANY_OS_HTTP_SECRET_BROKER_BASE_URL: ${COMPANY_OS_HTTP_SECRET_BROKER_BASE_URL:?set the HTTPS Vault Broker URL}
      COMPANY_OS_HTTP_SECRET_BROKER_BEARER_TOKEN_FILE: /run/company-os/secrets/secret-broker-bearer-token
      COMPANY_OS_METRICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${COMPANY_OS_API_LOOPBACK_PORT:?set the site API loopback port}:4310"
    depends_on:
      provision-runtime:
        condition: service_completed_successfully
      reference-data-node:
        condition: service_healthy

  web:
    image: ${COMPANY_OS_WEB_IMAGE:?set an immutable Web image digest}
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.20
    mem_limit: 192m
    pids_limit: 64
    networks: [internal]
    environment:
      COMPANY_OS_RELEASE_ID: ${COMPANY_OS_RELEASE_ID:?set the immutable release ID}
      COMPANY_OS_WEB_HOST: 0.0.0.0
      COMPANY_OS_WEB_PORT: 8080
      COMPANY_OS_WEB_MODE: formal
      COMPANY_OS_WEB_API_URL: ${COMPANY_OS_PUBLIC_URL:?set the site API origin}
    ports:
      - "127.0.0.1:${COMPANY_OS_WEB_LOOPBACK_PORT:?set the site Web loopback port}:8080"
    depends_on:
      api:
        condition: service_healthy

  backup:
    profiles: ["backup"]
    image: ${COMPANY_OS_OPS_IMAGE:?set an immutable operations image digest}
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    networks: [internal]
    command: ["node", "--experimental-strip-types", "scripts/postgres-encrypted-backup.ts"]
    environment:
      COMPANY_OS_DATABASE_URL_FILE: /run/company-os/backup-secrets/runtime-database-url
      NODE_EXTRA_CA_CERTS: /run/company-os/backup-secrets/internal-ca-cert.pem
      COMPANY_OS_BACKUP_DIRECTORY: /backup
      COMPANY_OS_BACKUP_ENCRYPTION_KEY_FILE: /run/company-os/backup-secrets/backup-encryption-key
      COMPANY_OS_BACKUP_INTERVAL_SECONDS: ${COMPANY_OS_BACKUP_INTERVAL_SECONDS:-86400}
      COMPANY_OS_BACKUP_S3_ENDPOINT: ${COMPANY_OS_BACKUP_S3_ENDPOINT:-}
      COMPANY_OS_BACKUP_S3_REGION: ${COMPANY_OS_BACKUP_S3_REGION:-}
      COMPANY_OS_BACKUP_S3_BUCKET: ${COMPANY_OS_BACKUP_S3_BUCKET:-}
      COMPANY_OS_BACKUP_S3_PREFIX: ${COMPANY_OS_BACKUP_S3_PREFIX:-backups}
      COMPANY_OS_BACKUP_S3_ACCESS_KEY_ID_FILE: /run/company-os/backup-secrets/zos-access-key-id
      COMPANY_OS_BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/company-os/backup-secrets/zos-secret-access-key
    volumes:
      - ${COMPANY_OS_SECRET_DIRECTORY:-/etc/company-os/secrets}:/run/company-os/backup-secrets:ro
      - company_os_staging_backups:/backup

networks:
  internal:
    name: ${COMPANY_OS_PRODUCT_NETWORK:?set the site-scoped product network}
    external: true

volumes:
  company_os_staging_backups:
    name: ${COMPANY_OS_BACKUP_VOLUME:?set the site-scoped backup volume}
  company_os_staging_data_node:
    name: ${COMPANY_OS_DATA_NODE_VOLUME:?set the site-scoped Data Node volume}
